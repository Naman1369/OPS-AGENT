apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent
  namespace: ops-agent
  labels:
    app.kubernetes.io/name: ops-agent
spec:
  # One replica: SQLite has a single writer and the audit hash chain must stay
  # linear. Scale out by moving the audit log to PostgreSQL first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ops-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ops-agent-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-agent-secrets
                  key: GEMINI_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/ops-agent
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1536Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ops-agent-data
